{% extends "index.html" %}

{% block content %}
<body>

    <div class="container">
        <h1>CSR Generator</h1>
        <h3>This CSR generator is only for testing and should not be used in any production systems.</h3>
        <label for="PrivateKey">Private Key</label>
        <textarea id="PrivateKey" name="PrivateKey" rows="25" cols="65" readonly>{{ key }}</textarea><br><br>
        <label for="CSR">CSR</label>
        <textarea id="CSR" name="CSR" rows="25" cols="65" readonly>{{ csr }}</textarea>
    </div>
</body>
{% endblock %}
